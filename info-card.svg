<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300">
  <defs>
    <linearGradient id="bg-grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080911" />
      <stop offset="50%" stop-color="#0f1322" />
      <stop offset="100%" stop-color="#05060b" />
    </linearGradient>
    <linearGradient id="header-grad-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#0d111d" />
    </linearGradient>
    <linearGradient id="border-grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50fa7b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0.6" />
    </linearGradient>
    <filter id="neon-glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-bg { fill: url(#bg-grad-card); rx: 12px; }
    .card-border { fill: none; stroke: url(#border-grad-card); stroke-width: 1.5px; rx: 12px; }
    .title-bar { fill: url(#header-grad-card); rx: 12px; }
    .title-text { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #50fa7b; filter: url(#neon-glow-card); }
    .section-title { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: bold; fill: #00f2fe; letter-spacing: 1px; }
    .label { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: bold; fill: #bd93f9; }
    .val { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .skill-name { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #f8f8f2; }
    .percent-text { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: bold; }
    
    .fade-item {
      opacity: 0;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .bar-fill {
      transform-origin: left;
      animation: fillBar 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateX(-6px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes fillBar {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
  </style>

  <!-- Background Card -->
  <rect class="card-bg" width="490" height="300" />
  <rect class="card-border" width="490" height="300" />

  <!-- Window Header -->
  <rect class="title-bar" width="490" height="38" />
  <rect x="0" y="37" width="490" height="1" fill="#21263d" />
  <circle cx="20" cy="19" r="5" fill="#ff5f56" />
  <circle cx="36" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="19" r="5" fill="#27c93f" />
  <text x="72" y="23" class="title-text">neofetch --sysinfo 92-avadh</text>

  <!-- Info Content -->
    <g class="fade-item" style="animation-delay: 0.1s;">
      <text x="22" y="65" class="label">OS:</text>
      <text x="95" y="65" class="val" fill="#f8f8f2">Linux / macOS / Windows Dev Env</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.18s;">
      <text x="22" y="85" class="label">Kernel:</text>
      <text x="95" y="85" class="val" fill="#f8f8f2">Full-Stack Software Engineering</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.26s;">
      <text x="22" y="105" class="label">Uptime:</text>
      <text x="95" y="105" class="val" fill="#f8f8f2">24/7 Continuous Deployment & Learning</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.34s;">
      <text x="22" y="125" class="label">Status:</text>
      <text x="95" y="125" class="val" fill="#50fa7b">🟢 Open for Innovative Projects</text>
    </g>
    <line x1="22" y1="152" x2="468" y2="152" stroke="#21263d" stroke-width="1" />
    <text x="22" y="170" class="section-title">⚡ TECH STACK & PROFICIENCY</text>
    <g class="fade-item" style="animation-delay: 0.45s;">
      <text x="22" y="190" class="skill-name">TypeScript / JS</text>
      <rect x="190" y="180" width="180" height="8" rx="4" fill="#161b2e" />
      <rect x="190" y="180" width="171" height="8" rx="4" fill="#00f2fe" class="bar-fill" style="animation-delay: 0.55s;" />
      <text x="380" y="190" class="percent-text" fill="#00f2fe">95%</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.54s;">
      <text x="22" y="210" class="skill-name">Python & Scripting</text>
      <rect x="190" y="200" width="180" height="8" rx="4" fill="#161b2e" />
      <rect x="190" y="200" width="162" height="8" rx="4" fill="#ff79c6" class="bar-fill" style="animation-delay: 0.64s;" />
      <text x="380" y="210" class="percent-text" fill="#ff79c6">90%</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.63s;">
      <text x="22" y="230" class="skill-name">React / Next.js</text>
      <rect x="190" y="220" width="180" height="8" rx="4" fill="#161b2e" />
      <rect x="190" y="220" width="165" height="8" rx="4" fill="#50fa7b" class="bar-fill" style="animation-delay: 0.73s;" />
      <text x="380" y="230" class="percent-text" fill="#50fa7b">92%</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.72s;">
      <text x="22" y="250" class="skill-name">Node.js / APIs</text>
      <rect x="190" y="240" width="180" height="8" rx="4" fill="#161b2e" />
      <rect x="190" y="240" width="158" height="8" rx="4" fill="#ffb86c" class="bar-fill" style="animation-delay: 0.82s;" />
      <text x="380" y="250" class="percent-text" fill="#ffb86c">88%</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.81s;">
      <text x="22" y="270" class="skill-name">Cloud & CI/CD</text>
      <rect x="190" y="260" width="180" height="8" rx="4" fill="#161b2e" />
      <rect x="190" y="260" width="153" height="8" rx="4" fill="#bd93f9" class="bar-fill" style="animation-delay: 0.91s;" />
      <text x="380" y="270" class="percent-text" fill="#bd93f9">85%</text>
    </g>

  <!-- Footer Palette -->
  <g class="fade-item" style="animation-delay: 0.9s;">
    <rect x="22" y="273" width="14" height="14" rx="3" fill="#ff5f56" /><rect x="42" y="273" width="14" height="14" rx="3" fill="#ffbd2e" /><rect x="62" y="273" width="14" height="14" rx="3" fill="#27c93f" /><rect x="82" y="273" width="14" height="14" rx="3" fill="#00f2fe" /><rect x="102" y="273" width="14" height="14" rx="3" fill="#bd93f9" /><rect x="122" y="273" width="14" height="14" rx="3" fill="#ff79c6" /><rect x="142" y="273" width="14" height="14" rx="3" fill="#50fa7b" /><rect x="162" y="273" width="14" height="14" rx="3" fill="#f1fa8c" />
  </g>
</svg>