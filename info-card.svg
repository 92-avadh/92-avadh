<svg xmlns="http://www.w3.org/2000/svg" width="490" height="280" viewBox="0 0 490 280">
  <style>
    .card-bg { fill: #0d1117; rx: 8px; stroke: #30363d; stroke-width: 1px; }
    .title-bar { fill: #161b22; rx: 8px; }
    .dot { rx: 50%; }
    .title-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #e6edf3; }
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: bold; fill: #58a6ff; }
    .value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #c9d1d9; }
    .line {
      opacity: 0;
      animation: fadeInLine 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInLine {
      0% { opacity: 0; transform: translateX(-8px); }
      100% { opacity: 1; transform: translateX(0); }
    }
  </style>

  <!-- Background -->
  <rect class="card-bg" width="490" height="280" />

  <!-- Title Bar Window Controls -->
  <rect class="title-bar" width="490" height="36" />
  <circle cx="20" cy="18" r="5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="5" fill="#27c93f" />
  <text x="72" y="22" class="title-text">neofetch --user 92-avadh</text>

  <!-- Info Lines -->
    <g class="line" style="animation-delay: 0.1s;">
      <text x="25" y="70" class="label">OS:</text>
      <text x="110" y="70" class="value">GitHub / Cloud Architecture</text>
    </g>
    <g class="line" style="animation-delay: 0.18s;">
      <text x="25" y="94" class="label">Host:</text>
      <text x="110" y="94" class="value">Developer Workstation</text>
    </g>
    <g class="line" style="animation-delay: 0.26s;">
      <text x="25" y="118" class="label">Kernel:</text>
      <text x="110" y="118" class="value">Full Stack & System Design</text>
    </g>
    <g class="line" style="animation-delay: 0.34s;">
      <text x="25" y="142" class="label">Uptime:</text>
      <text x="110" y="142" class="value">24/7 Continuous Learning</text>
    </g>
    <g class="line" style="animation-delay: 0.42s;">
      <text x="25" y="166" class="label">Stack:</text>
      <text x="110" y="166" class="value">TypeScript, React, Python, Node.js</text>
    </g>
    <g class="line" style="animation-delay: 0.5s;">
      <text x="25" y="190" class="label">Tools:</text>
      <text x="110" y="190" class="value">Git, Docker, VS Code, CI/CD Actions</text>
    </g>
    <g class="line" style="animation-delay: 0.58s;">
      <text x="25" y="214" class="label">Focus:</text>
      <text x="110" y="214" class="value">Building high-performance software & AI tooling</text>
    </g>
    <g class="line" style="animation-delay: 0.66s;">
      <text x="25" y="238" class="label">Status:</text>
      <text x="110" y="238" class="value">🟢 Open for collaboration & open-source</text>
    </g>

  <!-- Terminal Color Palette Footer -->
  <g class="line" style="animation-delay: 0.8s;">
    <rect x="25" y="245" width="16" height="16" rx="3" fill="#ff5f56" /><rect x="47" y="245" width="16" height="16" rx="3" fill="#ffbd2e" /><rect x="69" y="245" width="16" height="16" rx="3" fill="#27c93f" /><rect x="91" y="245" width="16" height="16" rx="3" fill="#58a6ff" /><rect x="113" y="245" width="16" height="16" rx="3" fill="#bc8cff" /><rect x="135" y="245" width="16" height="16" rx="3" fill="#39d353" />
  </g>
</svg>