<svg xmlns="http://www.w3.org/2000/svg" width="490" height="280" viewBox="0 0 490 280">
  <style>
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
    .title-bar { fill: #161b22; }
    .title-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #58a6ff; }
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: bold; fill: #58a6ff; }
    .val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .skill-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #8b949e; }
    .percent-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: bold; }
    
    .fade-item {
      opacity: 0;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateX(-5px); }
      100% { opacity: 1; transform: translateX(0); }
    }
  </style>

  <!-- Background -->
  <rect class="card-bg" width="490" height="280" rx="8" ry="8" />

  <!-- Title Bar -->
  <rect class="title-bar" width="490" height="36" rx="8" ry="8" />
  <circle cx="20" cy="18" r="5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="5" fill="#27c93f" />
  <text x="72" y="22" class="title-text">neofetch --user andriidrok1</text>

  <!-- Info Content -->
    <g class="fade-item" style="animation-delay: 0.08s;">
      <text x="20" y="65" class="label">User:</text>
      <text x="95" y="65" class="val" fill="#c9d1d9">Andrii Drok (andriidrok1)</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.14s;">
      <text x="20" y="85" class="label">Degree:</text>
      <text x="95" y="85" class="val" fill="#c9d1d9">CS @ San Francisco State University</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.2s;">
      <text x="20" y="105" class="label">Stack:</text>
      <text x="95" y="105" class="val" fill="#c9d1d9">Python, TypeScript, React, FastAPI, Docker</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.26s;">
      <text x="20" y="125" class="label">Projects:</text>
      <text x="95" y="125" class="val" fill="#c9d1d9">autobroll, strategy-checker, compound</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.32s;">
      <text x="20" y="145" class="label">Uptime:</text>
      <text x="95" y="145" class="val" fill="#c9d1d9">24/7 Building & Backtesting</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.38s;">
      <text x="20" y="165" class="label">Focus:</text>
      <text x="95" y="165" class="val" fill="#c9d1d9">AI Video Tools & Quantitative Markets</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.44s;">
      <text x="20" y="185" class="label">Status:</text>
      <text x="95" y="185" class="val" fill="#3fb950">🟢 Open for Open-Source & Collabs</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.5s;">
      <text x="20" y="210" class="skill-name">Python / FastAPI</text>
      <rect x="180" y="201" width="160" height="7" rx="3" ry="3" fill="#161b22" />
      <rect x="180" y="201" width="150" height="7" rx="3" ry="3" fill="#58a6ff" />
      <text x="350" y="210" class="percent-text" fill="#58a6ff">94%</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.58s;">
      <text x="20" y="228" class="skill-name">TypeScript / React</text>
      <rect x="180" y="219" width="160" height="7" rx="3" ry="3" fill="#161b22" />
      <rect x="180" y="219" width="144" height="7" rx="3" ry="3" fill="#3fb950" />
      <text x="350" y="228" class="percent-text" fill="#3fb950">90%</text>
    </g>
    <g class="fade-item" style="animation-delay: 0.66s;">
      <text x="20" y="246" class="skill-name">Three.js & Docker</text>
      <rect x="180" y="237" width="160" height="7" rx="3" ry="3" fill="#161b22" />
      <rect x="180" y="237" width="136" height="7" rx="3" ry="3" fill="#bc8cff" />
      <text x="350" y="246" class="percent-text" fill="#bc8cff">85%</text>
    </g>

  <!-- Footer Palette -->
  <g class="fade-item" style="animation-delay: 0.8s;">
    <rect x="400" y="255" width="8" height="8" rx="2" ry="2" fill="#ff5f56" /><rect x="411" y="255" width="8" height="8" rx="2" ry="2" fill="#ffbd2e" /><rect x="422" y="255" width="8" height="8" rx="2" ry="2" fill="#27c93f" /><rect x="433" y="255" width="8" height="8" rx="2" ry="2" fill="#58a6ff" /><rect x="444" y="255" width="8" height="8" rx="2" ry="2" fill="#bc8cff" /><rect x="455" y="255" width="8" height="8" rx="2" ry="2" fill="#3fb950" /><rect x="466" y="255" width="8" height="8" rx="2" ry="2" fill="#d2a8ff" />
  </g>
</svg>